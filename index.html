<!DOCTYPE html>
<html lang="zh-CN" data-edition="internal">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OD 情报中心 · AI 组织设计研究</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #242837;
      --surface3: #2a2f40;
      --border: #2e3348;
      --text: #e1e4ed;
      --text2: #8b91a8;
      --accent: #6c8cff;
      --accent2: #a78bfa;
      --green: #34d399;
      --green-dim: rgba(52, 211, 153, 0.12);
      --orange: #fbbf24;
      --red: #f87171;
      --trust-high: #fbbf24;
      --trust-mid: #60a5fa;
      --trust-ref: #a78bfa;

    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #1a1d27 0%, #242837 100%);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
    }
    .header-inner {
      max-width: 960px;
      margin: 0 auto;
      padding: 16px 24px;
    }
    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .header h1 {
      font-size: 20px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header p {
      font-size: 12px;
      color: var(--text2);
      margin-top: 2px;
    }
    .header-stats {
      display: flex;
      gap: 16px;
      font-size: 12px;
      color: var(--text2);
    }
    .header-stats strong { color: var(--accent); font-weight: 600; }
    .header-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      flex-wrap: wrap;
    }
    .edition-share-button {
      min-height: 34px;
      padding: 7px 11px;
      border: 1px solid rgba(108, 140, 255, 0.45);
      border-radius: 9px;
      background: rgba(108, 140, 255, 0.12);
      color: var(--text);
      font: inherit;
      font-size: 12px;
      font-weight: 760;
      cursor: pointer;
    }
    .edition-share-button:hover {
      background: rgba(108, 140, 255, 0.2);
      border-color: var(--accent);
    }

    /* Tabs */
    .tab-bar {
      display: flex;
      gap: 4px;
      background: var(--surface);
      padding: 3px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .tab-btn {
      flex: 1;
      padding: 8px 12px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--text2);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-width: 0;
      white-space: nowrap;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active {
      background: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    
    .tab-btn.kb-tab.active {
      background: var(--orange);
      color: #000;
    }
    .tab-btn.levels-tab.active {
      background: var(--green);
      color: #000;
    }
    
    
    
    .tab-btn .badge {
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 10px;
      background: rgba(255,255,255,0.15);
      font-weight: 600;
    }
    .tab-btn.active .badge {
      background: rgba(255,255,255,0.25);
    }

    /* Page visibility */
    .page { display: none; }
    .page.active { display: block; }

    /* =================== Information Page =================== */
    .controls {
      max-width: 900px;
      margin: 20px auto;
      padding: 0 24px;
    }
    .sync-bridge {
      margin-bottom: 14px;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid rgba(102, 125, 234, 0.32);
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.10);
    }
    .sync-bridge-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .sync-bridge strong {
      display: block;
      color: var(--text);
      font-size: 15px;
    }
    .sync-bridge p {
      margin-top: 4px;
      color: var(--text2);
      font-size: 13px;
    }
    .sync-bridge-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .sync-bridge a {
      min-height: 34px;
      padding: 7px 11px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 760;
      background: var(--green);
      color: #06140f;
    }
    .sync-bridge a.secondary {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .status-dashboard {
      margin-bottom: 14px;
    }
    .public-status-panel {
      display: grid;
      gap: 12px;
    }
    .public-status-summary {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: center;
    }
    .public-status-eyebrow {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 7px;
      color: var(--text3);
      font-size: 12px;
      font-weight: 760;
      letter-spacing: 0.04em;
    }
    .public-status-title {
      margin: 0;
      color: var(--text);
      font-size: 17px;
      line-height: 1.5;
      font-weight: 820;
    }
    .public-status-note {
      margin-top: 6px;
      color: var(--text2);
      font-size: 13px;
      line-height: 1.6;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.16);
      color: var(--text2);
      font-size: 12px;
      font-weight: 760;
    }
    .public-status-panel.pass .status-pill { background: rgba(52, 211, 153, 0.16); color: var(--green); }
    .public-status-panel.warn .status-pill { background: rgba(245, 158, 11, 0.16); color: var(--orange); }
    .public-status-panel.fail .status-pill { background: rgba(248, 113, 113, 0.16); color: #fca5a5; }
    .system-health-details {
      border-top: 1px solid var(--border);
      padding-top: 10px;
    }
    .system-health-details summary {
      width: fit-content;
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      padding: 7px 11px;
      border-radius: 9px;
      color: var(--text);
      background: var(--surface2);
      border: 1px solid var(--border);
      font-size: 13px;
      font-weight: 780;
      cursor: pointer;
      list-style: none;
    }
    .system-health-details summary::-webkit-details-marker {
      display: none;
    }
    .system-health-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 12px;
    }
    .system-health-item {
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(32, 36, 52, 0.72);
      border: 1px solid var(--border);
      color: var(--text2);
      font-size: 13px;
      line-height: 1.5;
    }
    .system-health-item strong {
      display: block;
      color: var(--text);
      font-size: 12px;
      margin-bottom: 2px;
    }
    .status-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .status-actions a,
    .status-actions .disabled-action {
      min-height: 30px;
      display: inline-flex;
      align-items: center;
      padding: 6px 9px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 12px;
      font-weight: 740;
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .status-actions .disabled-action {
      color: var(--text3);
      cursor: not-allowed;
      opacity: 0.76;
    }
    .manifest-fallback-warning {
      padding: 10px 12px;
      border: 1px solid rgba(245, 158, 11, 0.5);
      border-radius: 10px;
      color: var(--orange);
      background: rgba(245, 158, 11, 0.08);
      font-size: 13px;
      font-weight: 720;
    }
    .search-box {
      width: 100%;
      padding: 12px 16px 12px 42px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-box:focus { border-color: var(--accent); }
    .search-wrap { position: relative; }
    .search-wrap svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text2);
    }
    .filter-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
      align-items: center;
    }
    .primary-filter-groups {
      margin-top: 14px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(26, 29, 39, 0.62);
    }
    .primary-filter-groups .filter-row:first-child { margin-top: 0; }
    .filter-label {
      font-size: 13px;
      color: var(--text2);
      margin-right: 4px;
      flex-shrink: 0;
    }
    .filter-tag {
      padding: 5px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text2);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      font-family: inherit;
    }
    .filter-tag:hover { border-color: var(--accent); color: var(--text); }
    .filter-tag.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .filter-tag.trust-high.active { background: var(--trust-high); border-color: var(--trust-high); color: #000; }
    .filter-tag.trust-mid.active { background: var(--trust-mid); border-color: var(--trust-mid); color: #fff; }
    .filter-tag.trust-ref.active { background: var(--trust-ref); border-color: var(--trust-ref); color: #fff; }
    .filter-tag.source-tag.active { background: var(--green); border-color: var(--green); color: #000; }
    @media (max-width: 860px) {
      .status-dashboard { grid-template-columns: 1fr; }
    }
    .filter-tag.collapsed { display: none; }
    .filter-tag.expanded { display: inline-block; }
    .filter-more {
      padding: 5px 12px;
      background: transparent;
      border: 1px dashed var(--border);
      border-radius: 20px;
      color: var(--text2);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-more:hover { border-color: var(--accent); color: var(--accent); }
    .advanced-filters {
      margin-top: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(26, 29, 39, 0.48);
      overflow: hidden;
    }
    .advanced-filters summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 13px;
      font-weight: 650;
      cursor: pointer;
      list-style: none;
    }
    .advanced-filters summary::-webkit-details-marker { display: none; }
    .advanced-filters summary::after {
      content: '展开 ↓';
      color: var(--text2);
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
    }
    .advanced-filters[open] summary::after { content: '收起 ↑'; }
    .advanced-filter-hint {
      color: var(--text2);
      font-size: 12px;
      font-weight: 400;
    }
    .advanced-filter-body {
      padding: 0 14px 14px;
      border-top: 1px solid var(--border);
    }
    .advanced-filter-body .coverage { margin-bottom: 0; }
    .stats {
      margin-top: 12px;
      font-size: 13px;
      color: var(--text2);
    }
    .stats strong { color: var(--accent); }

    .content {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 24px 60px;
    }

    /* Day Group */
    .day-group { margin-top: 32px; }
    .day-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .day-header h2 { font-size: 17px; font-weight: 600; color: var(--text); }
    .day-count {
      font-size: 12px;
      background: var(--surface2);
      padding: 2px 10px;
      border-radius: 12px;
      color: var(--text2);
    }

    /* Card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
    }
    .card:hover {
      border-color: var(--accent);
      box-shadow: 0 2px 16px rgba(108, 140, 255, 0.08);
      transform: translateY(-1px);
    }
    .card.active {
      border-color: var(--green);
      box-shadow: 0 4px 24px rgba(52, 211, 153, 0.1);
    }
    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .card-title-area { flex: 1; min-width: 0; }
    .card-title {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.4;
      color: var(--text);
    }
    .card-brief {
      font-size: 13px;
      color: var(--text2);
      margin-top: 4px;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .card-trust-mini {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 500;
      white-space: nowrap;
    }
    .trust-high { background: rgba(251, 191, 36, 0.15); color: var(--trust-high); }
    .trust-mid { background: rgba(96, 165, 250, 0.15); color: var(--trust-mid); }
    .trust-ref { background: rgba(167, 139, 250, 0.15); color: var(--trust-ref); }
    .card-expand-icon {
      width: 20px;
      height: 20px;
      color: var(--text2);
      transition: transform 0.25s;
      flex-shrink: 0;
    }
    .card.active .card-expand-icon {
      transform: rotate(180deg);
      color: var(--green);
    }
    .card-meta-mini {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 6px;
      font-size: 12px;
      color: var(--text2);
    }

    /* Reader Panel */
    .reader-panel {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 12px;
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease, margin 0.3s ease;
      margin-top: 0;
    }
    .reader-panel.open {
      max-height: 1200px;
      opacity: 1;
      margin-top: 4px;
    }
    .reader-inner { padding: 24px; }
    .reader-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 16px;
    }
    .reader-num {
      font-size: 32px;
      font-weight: 800;
      color: var(--accent);
      opacity: 0.3;
      line-height: 1;
      flex-shrink: 0;
    }
    .reader-title { font-size: 18px; font-weight: 700; line-height: 1.5; }
    .reader-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      padding: 10px 14px;
      background: var(--surface);
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 12px;
    }
    .reader-meta-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--text2);
    }
    .reader-meta-item strong { color: var(--text); font-weight: 500; }
    .reader-section { margin-bottom: 16px; }
    .reader-section-label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text2);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .reader-section-label .icon { width: 16px; height: 16px; }
    .reader-summary { font-size: 15px; line-height: 1.8; }
    .reader-insight {
      font-size: 15px;
      color: var(--green);
      background: var(--green-dim);
      padding: 16px 18px;
      border-radius: 10px;
      border-left: 4px solid var(--green);
      line-height: 1.8;
    }
    .reader-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }
    .reader-tag {
      font-size: 12px;
      padding: 4px 10px;
      background: var(--surface);
      border-radius: 6px;
      color: var(--text2);
      cursor: pointer;
      transition: all 0.2s;
    }
    .reader-tag:hover { background: var(--border); color: var(--text); }
    .reader-actions {
      display: flex;
      gap: 12px;
      align-items: center;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }
    .btn-read-original {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
      text-decoration: none;
    }
    .btn-read-original:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-close-panel {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 16px;
      background: transparent;
      color: var(--text2);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-close-panel:hover { border-color: var(--text2); color: var(--text); }
    
    

    /* Source coverage bar */
    .coverage {
      margin-top: 16px;
      padding: 12px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    .coverage-title { font-size: 12px; color: var(--text2); margin-bottom: 8px; }
    .coverage-bar { display: flex; flex-wrap: wrap; gap: 6px; }
    .coverage-item {
      font-size: 11px;
      padding: 3px 8px;
      background: var(--surface2);
      border-radius: 12px;
      color: var(--text2);
    }
    .coverage-item.active {
      background: rgba(52, 211, 153, 0.15);
      color: var(--green);
    }
    .coverage-count { color: var(--text); font-weight: 600; }

    /* =================== Daily Report Page =================== */
    .report-page {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 24px 60px;
    }
    .report-summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 28px;
    }
    .report-stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }
    .report-stat-value {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.2;
    }
    .report-stat-label { font-size: 12px; color: var(--text2); margin-top: 4px; }

    /* =================== Master Report Banner =================== */
    .master-report-banner {
      background: linear-gradient(135deg, #1a1d27 0%, #232840 100%);
      border: 1px solid var(--accent);
      border-radius: 14px;
      padding: 20px 24px;
      margin-bottom: 28px;
      position: relative;
      overflow: hidden;
    }
    .master-report-banner::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent2), var(--green));
    }
    .master-report-banner-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
      background: rgba(108, 140, 255, 0.15);
      color: var(--accent);
      border: 1px solid rgba(108, 140, 255, 0.3);
      margin-bottom: 10px;
    }
    .master-report-banner h2 {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }
    .master-report-banner .subtitle {
      font-size: 13px;
      color: var(--text2);
      margin-bottom: 14px;
    }
    .master-report-stats {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .master-report-stat {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text2);
    }
    .master-report-stat strong { color: var(--text); font-weight: 600; }
    .sub-props-grid {

    /* Toast notification */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--green);
      color: #000;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      z-index: 1000;
      transition: transform 0.3s ease;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
      visibility: visible;
    }

    /* ============================================================
       OD 情报中心 — 可读性优化补丁 v1
       原则：YAGNI / DRY —— 仅 override，不改写原规则，便于回滚。
       ============================================================ */

    /* ---------- 1. 文字对比度：text2 提亮 + 三档分级 ---------- */
    :root {
      --text2: #a3a9bf;     /* 由 #8b91a8 提亮，对比度 ~7.2:1 */
      --text3: #8b91a8;     /* 装饰性最次要文字（icon/dot） */
    }

    /* 原本 12-13px 用 --text2 的正文升级为 --text + 透明度，避免"灰糊糊" */
    .card-brief,
    .kb-card-desc,
    .pick-reason,
    .focus-text,
    .xhs-image-desc {
      color: var(--text);
      opacity: 0.82;
    }

    /* ---------- 2. 字号收敛：去掉中间档，建立 5 档层级 ---------- */
    .header h1        { font-size: 22px; letter-spacing: -0.01em; }
    .header p         { font-size: 13px; }
    .tab-btn          { font-size: 13px; padding: 11px 14px; min-height: 44px; }
    .card-title       { font-size: 17px; line-height: 1.45; }
    .card-brief       { font-size: 14px; }
    .card-meta-mini   { font-size: 13px; }
    .day-header h2    { font-size: 18px; }
    .day-count        { font-size: 13px; }
    .reader-title     { font-size: 19px; }
    .reader-summary   { font-size: 15px; }
    .reader-insight   { font-size: 15px; }
    .reader-meta      { font-size: 13px; }
    .report-day-title { font-size: 17px; }
    .report-day-meta  { font-size: 13px; }
    .spotlight-title  { font-size: 17px; }
    .spotlight-finding-item { font-size: 14px; }
    .master-report-banner h2 { font-size: 18px; }
    .kb-card-title    { font-size: 17px; }
    .kb-card-desc     { font-size: 14px; }
    .report-stat-label { font-size: 13px; }

    /* 11px 装饰性标签统一加字距 */
    .card-trust-mini, .badge, .report-day-badge,
    .kb-card-type, .xhs-note-type, .coverage-item,
    .kb-card-tag, .reader-tag, .report-tag,
    .kb-reader-topic-tag, .spotlight-badge,
    .master-report-banner-badge, .reader-section-label {
      font-size: 11px;
      letter-spacing: 0.04em;
    }

    /* ---------- 3. 标题去渐变（提升对比度） ---------- */
    .header h1 {
      background: none;
      -webkit-text-fill-color: var(--text);
      color: var(--text);
    }
    .report-stat-value {
      background: none;
      -webkit-text-fill-color: var(--accent);
      color: var(--accent);
      font-size: 30px;
    }

    /* ---------- 4. 卡片 padding & 间距加大 ---------- */
    .card {
      padding: 20px 22px;
      margin-bottom: 12px;
    }
    .day-group   { margin-top: 36px; }
    .day-header  { margin-bottom: 18px; padding-bottom: 10px; }

    /* ---------- 5. 颜色语义减负：绿色仅保留「选中/打开」一种含义 ---------- */
    /* 洞察、重点、Spotlight 全部统一到 accent 色 */
    .reader-insight {
      color: var(--text);
      background: rgba(108, 140, 255, 0.08);
      border-left-color: var(--accent);
    }
    .spotlight-finding-item {
      color: var(--text);
      background: rgba(108, 140, 255, 0.06);
      border-left-color: var(--accent);
    }
    .today-spotlight        { border-color: var(--border); }
    .today-spotlight::before {
      background: linear-gradient(90deg, var(--accent), var(--accent2));
    }
    .spotlight-badge {
      background: rgba(108, 140, 255, 0.15);
      color: var(--accent);
      border-color: rgba(108, 140, 255, 0.3);
    }
    .spotlight-btn         { background: var(--accent); color: #fff; }
    .spotlight-btn:hover   { background: #5a7ae0; transform: none; }
    .pick-reason           { color: var(--text); }
    .pick-item             { border-left-color: var(--accent); }
    .pick-item:hover       { border-left-color: var(--accent2); }

    /* ---------- 6. tab badge 在 active 状态下的对比度修复 ---------- */
    .tab-btn.active .badge {
      background: rgba(0, 0, 0, 0.28);
      color: #fff;
    }

    /* ---------- 7. 容器宽度统一 + 阅读区限宽 ---------- */
    .header-inner,
    .controls,
    .content,
    .report-page,
    .kb-page,
    .footer {
      max-width: 1080px;
    }
    /* 卡片单列保留 760px，单行字符数 ≈ 70，最舒适阅读宽度 */
    .card,
    .reader-panel,
    .report-day-card,
    .master-report-banner,
    .today-spotlight {
      max-width: 760px;
      margin-left: auto;
      margin-right: auto;

    /* ---------- 8. 去掉多余 hover 抬升，整体更稳定 ---------- */

    .report-day-card:hover,
    .kb-card:hover,
    .btn-read-original:hover,
    .master-report-btn-primary:hover,
    .spotlight-btn:hover,
    .xhs-note-card:hover {
      transform: none;
    }


    /* ---------- 9. mark 高亮更柔和 ---------- */
    mark {
      background: rgba(108, 140, 255, 0.18);
      color: var(--accent);
      font-weight: 500;
    }

    /* ---------- 11. 移动端对齐 ---------- */

      .reader-panel,
      .report-day-card,
      .master-report-banner,

    /* ============================================================
       OD 情报中心 — DESIGN.md alignment patch v2

    :root {

    function esc(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function truncate(str, len) {
      if (!str) return '';
      return str.length > len ? str.substring(0, len) + '...' : str;
    }
    function highlightText(text, query) {
      if (!query || !text) return text;
      const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      return text.replace(new RegExp(`(${escaped})`, 'gi'), '<mark>$1</mark>');
    }
    function showToast(msg) {

    async function copyText(text, successMessage) {
      try {
        await navigator.clipboard.writeText(text);
      } catch (e) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        document.execCommand('copy');
        ta.remove();
      }
      showToast(successMessage || '已复制');
    }

    function statusClass(status) {
      if (status === 'pass' || status === 'formal') return 'pass';
      if (status === 'fail' || status === 'missing') return 'fail';
      return 'warn';
    }
    function statusText(status) {
      const map = {
        pass: '可信',
        warn: '待验证',
        fail: '失败',
        formal: '正式决策稿',
        scheduled: '待今日正式运行',
        fallback: '今日专题待正式更新',
        'needs-rerun': '今日专题待正式更新',
        missing: '缺失',
        'pending-link-check': '待验证'
      };
      return map[status] || status || '未知';
    }
    function overallPublicStatus(...statuses) {
      if (statuses.some(status => statusClass(status) === 'fail')) return 'fail';
      if (statuses.some(status => statusClass(status) === 'warn')) return 'warn';
      return 'pass';
    }
    function publicTopicStatus(topics) {
      if (topics?.todayStatus === 'formal') return `今日专题已正式更新`;
      if (topics?.todayStatus === 'scheduled') return `今日专题等待正式运行`;
      if (topics?.todayStatus === 'fallback' || topics?.todayStatus === 'needs-rerun') return `今日专题待正式更新`;
      return `今日专题状态待验证`;
    }
    function healthNumber(value, fallback = '未知') {
      return value === 0 || value ? value : fallback;
    }
    function getPublicScanBridgeState(info) {
      const latestScanUrl = info?.homepageBridge?.latestScanUrl || '';
      const publicScanBridge = Array.isArray(info?.links?.publicScanBridge) ? info.links.publicScanBridge : [];
      const matched = publicScanBridge.find(entry => entry?.url === latestScanUrl);
      if (!latestScanUrl) {
        return { status: 'pending-link-check', showLatestScan: false, note: '未配置最新扫描链接' };
      }
      if (matched?.ok === true) {
        return { status: 'pass', showLatestScan: true, note: '链接已校验' };
      }
      if (matched?.hardBroken || matched?.status === 404) {
        return { status: 'fail', showLatestScan: false, note: '最新扫描不可访问，改用公开镜像入口' };
      }
      if (matched) {
        return { status: 'pending-link-check', showLatestScan: false, note: '最新扫描待验证，请先查看公开镜像' };
      }
      return { status: 'pending-link-check', showLatestScan: false, note: '最新扫描待验证，请先查看公开镜像' };

    // ============================================================
    // Parser
    // ============================================================
    function parseDigest(markdown) {
      const lines = markdown.split('\n');
      let currentDay = null;
      let currentItem = null;
      const days = [];
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        if (line.includes('<!--')) continue;
        const dayMatch = line.match(/^## (\d{4}-\d{2}-\d{2})\b/);
        if (dayMatch) {
          if (currentDay && currentDay.items.length > 0) days.push(currentDay);
          currentDay = { date: dayMatch[1], items: [] };
          currentItem = null;
          continue;
        }
        if (!currentDay) continue;
        const titleMatch = line.match(/^### \[([A-Za-z0-9-]+)\]\s+(.+)/);
        if (titleMatch) {
          currentItem = {
            id: titleMatch[1], title: titleMatch[2],
            summary: '', source: '', sourceUrl: '', sources: [], platform: '',
            readingTier: '', readingValue: '', background: '', boundary: '',
            trust: '', infoType: '', channelType: '', conclusionConfidence: '',
            verificationQuestion: '', insight: '', tags: [], time: ''
          };
          currentDay.items.push(currentItem);
          continue;
        }
        if (!currentItem) continue;
        const editorialMatch = line.match(/^- \*\*(阅读层级|阅读价值|背景与变化|适用边界)\*\*[：:]\s*(.+)/);
        if (editorialMatch) {
          const fields = { 阅读层级: 'readingTier', 阅读价值: 'readingValue', 背景与变化: 'background', 适用边界: 'boundary' };
          currentItem[fields[editorialMatch[1]]] = editorialMatch[2].trim();
          continue;
        }
        const summaryMatch = line.match(/^- \*\*事件摘要\*\*[：:]\s*(.+)/);
        if (summaryMatch) { currentItem.summary = summaryMatch[1]; continue; }
        const sourceMatch = line.match(/^- \*\*来源\*\*[：:]\s*(.+)/);
        if (sourceMatch) {
          const raw = sourceMatch[1].trim();
          currentItem.sources = InfoCardSchema.sourceLinks(raw);
          currentItem.source = currentItem.sources.map(source => source.label).join(' · ') || raw;
          currentItem.sourceUrl = currentItem.sources[0]?.url || '';
          continue;
        }
        const platformMatch = line.match(/^- \*\*来源平台\*\*[：:]\s*(.+)/);
        if (platformMatch) { currentItem.platform = platformMatch[1].trim(); continue; }
        const trustMatch = line.match(/^- \*\*来源可信度\*\*[：:]\s*(.+)/);
        if (trustMatch) { currentItem.trust = trustMatch[1].trim(); continue; }
        const infoTypeMatch = line.match(/^- \*\*信息类型\*\*[：:]\s*(.+)/);
        if (infoTypeMatch) { currentItem.infoType = infoTypeMatch[1].trim(); continue; }
        const channelTypeMatch = line.match(/^- \*\*渠道类型\*\*[：:]\s*(.+)/);
        if (channelTypeMatch) { currentItem.channelType = channelTypeMatch[1].trim(); continue; }
        const confidenceMatch = line.match(/^- \*\*结论置信度\*\*[：:]\s*(.+)/);
        if (confidenceMatch) { currentItem.conclusionConfidence = confidenceMatch[1].trim(); continue; }
        const verificationMatch = line.match(/^- \*\*验证问题\*\*[：:]\s*(.+)/);
        if (verificationMatch) { currentItem.verificationQuestion = verificationMatch[1].trim(); continue; }
        const insightMatch = line.match(/^- \*\*OD启示\*\*[：:]\s*(.+)/);
        if (insightMatch) { currentItem.insight = insightMatch[1]; continue; }
        const tagMatch = line.match(/^- \*\*标签\*\*[：:]\s*(.+)/);
        if (tagMatch) {
          currentItem.tags = tagMatch[1].match(/#[\w\u4e00-\u9fff-]+/g) || [];
          currentItem.tags = currentItem.tags.map(t => t.replace('#', ''));
          continue;
        }
        const timeMatch = line.match(/^- \*\*抓取时间\*\*[：:]\s*(.+)/);
        if (timeMatch) { currentItem.time = timeMatch[1]; continue; }
      }
      if (currentDay && currentDay.items.length > 0) days.push(currentDay);
      return days;
    }

    // ============================================================
    // Load
    // ============================================================
    async function loadData() {
      await loadStatusManifests();
      try {
        const resp = await fetch('./digest.md');
        if (resp.ok) {
          const text = await resp.text();
          allDays = parseDigest(text);
        }
      } catch (e) { console.log('digest.md not loaded'); }

      // Try loading knowledge base catalog
      try {
        const resp = await fetch('./knowledge/catalog.json');
        if (resp.ok) {
          const data = await resp.json();
          kbReports = data.reports || [];
          kbSources = data.knowledgeSources || [];
          // Dynamically update source types and topic tags from catalog categories
          if (data.categories) {
            if (data.categories.sourceType) {
              for (const [key, info] of Object.entries(data.categories.sourceType)) {
                if (!KB_SOURCE_TYPES[key]) {
                  KB_SOURCE_TYPES[key] = { label: info.label, icon: info.icon, class: key };
                }
              }
            }
            if (data.categories.topic) {
              for (const [key, info] of Object.entries(data.categories.topic)) {
                if (!KB_TOPIC_TAGS[key]) {
                  KB_TOPIC_TAGS[key] = info.icon;
                }
              }
            }
          }
        }
      } catch (e) { console.log('kb catalog not loaded'); }

      updateBadges();
      renderStatusDashboard();
      renderInfoPage();
      if (ODIC_EDITION !== 'hr') renderLevelsPage();

      const params = new URLSearchParams(window.location.search);
      const sharedKBId = params.get('kb');
      if (sharedKBId) {
        switchTab('kb');
        setTimeout(() => openKBReader(sharedKBId), 0);
      }
    }

    function updateBadges() {

    function getAllTags() {
      const tagSet = new Set();
      allDays.forEach(d => d.items.forEach(item => item.tags.forEach(t => tagSet.add(t))));
      return Array.from(tagSet).sort();
    }
    function getAllPlatforms() {
      const srcMap = new Map();
      allDays.forEach(d => d.items.forEach(item => {
        const p = item.platform || item.source || '未知';
        srcMap.set(p, (srcMap.get(p) || 0) + 1);
      }));
      return Array.from(srcMap.entries()).sort((a, b) => b[1] - a[1]);
    }
    function getTrustStats() {
      const stats = { '⭐高': 0, '📰较高': 0, '💬参考': 0, '': 0 };
      allDays.forEach(d => d.items.forEach(item => {
        const t = item.trust || '';
        if (stats[t] !== undefined) stats[t]++;
        else stats['']++;
      }));
      return stats;
    }
    function classifyChannel(item) {
      const declared = InfoCardSchema.channelType(item.channelType);
      const channels = { 官方: 'official', 媒体: 'media', 报告学术: 'research', 社媒公众号: 'social', JD薪酬: 'jobs' };
      if (item.channelType) return channels[declared] || null;

      const sourceText = [item.platform, item.source, item.sourceUrl].filter(Boolean).join(' ').toLowerCase();
      if (/jobs?|careers?|招聘|薪酬|salary|levels\.fyi|glassdoor/.test(sourceText)) return 'jobs';
      if (/微信公众号|小红书|知乎|即刻|linkedin|twitter|reddit|weibo|微博|脉脉/.test(sourceText)) return 'social';
      if (/mckinsey|bcg|bain|mercer|deloitte|德勤|pwc|gartner|hbr|harvard|stanford|mit|arxiv|ssrn|oecd|ilo|wef|nber/.test(sourceText)) return 'research';
      if (/36氪|机器之心|钛媒体|虎嗅|界面新闻|第一财经|晚点|新智元|量子位|techcrunch|the verge|wired|bloomberg|reuters|hacker news|infoq/.test(sourceText)) return 'media';
      if (/官网|官方|newsroom|investor|sec\.|help\.|openai|anthropic|microsoft|google|amazon|aws|meta|oracle|gitlab|bytedance|字节跳动|腾讯/.test(sourceText)) return 'official';
      return null;
    }
    function matchesTopicCategory(item, category) {
      const topic = TOPIC_FILTERS[category];
      if (!topic) return false;
      const haystack = [item.title, item.summary, item.insight, ...(item.tags || [])].filter(Boolean).join(' ').toLowerCase();
      return topic.keywords.some(keyword => haystack.includes(keyword.toLowerCase()));
    }

    function renderSourceFilters() {
      const container = document.getElementById('sourceFilters');
      const platforms = getAllPlatforms();
      if (platforms.length === 0) { container.innerHTML = ''; return; }
      let html = '<span class="filter-label">来源：</span>';
      html += `<span class="filter-tag source-tag ${!activeSourceFilter ? 'active' : ''}" onclick="setSourceFilter(null)">全部</span>`;
      platforms.forEach(([name, count], index) => {
        const hidden = !sourceExpanded && index >= FILTER_LIMIT;
        html += `<span class="filter-tag source-tag ${activeSourceFilter === name ? 'active' : ''} ${hidden ? 'collapsed' : 'expanded'}" onclick="setSourceFilter('${name.replace(/'/g, "\\'")}')">${esc(name)} (${count})</span>`;
      });
      // 如果超过限制，添加展开/收起按钮
      if (platforms.length > FILTER_LIMIT) {
        html += `<button class="filter-more" onclick="toggleSourceExpand()">${sourceExpanded ? '收起 ↑' : '更多 ↓'}</button>`;
      }
      container.innerHTML = html;

    function renderTagFilters() {
      const container = document.getElementById('tagFilters');
      const tags = getAllTags();
      if (tags.length === 0) { container.innerHTML = ''; return; }
      let html = '<span class="filter-label">标签：</span>';
      html += `<span class="filter-tag ${!activeTagFilter ? 'active' : ''}" onclick="setTagFilter(null)">全部</span>`;
      tags.forEach((tag, index) => {
        const hidden = !tagExpanded && index >= FILTER_LIMIT;
        html += `<span class="filter-tag ${activeTagFilter === tag ? 'active' : ''} ${hidden ? 'collapsed' : 'expanded'}" onclick="setTagFilter('${tag}')">#${esc(tag)}</span>`;
      });
      // 如果超过限制，添加展开/收起按钮
      if (tags.length > FILTER_LIMIT) {
        html += `<button class="filter-more" onclick="toggleTagExpand()">${tagExpanded ? '收起 ↑' : '更多 ↓'}</button>`;

    let coverageExpanded = false;

    function renderInformationCard(day, item, query) {
      const cardKey = `${day.date}-${item.id}`;
      const active = openCardId === cardKey;
      const type = InfoCardSchema.informationType(item.infoType);
      const section = (label, value, className = 'reader-summary') => value
        ? `<div class="reader-section"><div class="reader-section-label">${esc(label)}</div><div class="${className}">${highlightText(esc(value), query)}</div></div>` : '';
      const sources = item.sources.map(source => `<a class="btn-read-original" href="${esc(source.url)}" target="_blank" rel="noopener noreferrer">${esc(source.label)} ↗</a>`).join('');
      return `<div class="card ${active ? 'active' : ''}" role="button" tabindex="0" aria-expanded="${active}" aria-controls="panel-${cardKey}" onclick="toggleCard('${day.date}', '${item.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleCard('${day.date}', '${item.id}');}">
        <div class="card-header"><div class="card-title-area"><div class="card-title">${highlightText(esc(item.title), query)}</div><div class="card-brief">${highlightText(esc(item.readingValue || truncate(item.summary, 100)), query)}</div></div><div class="card-right"><svg class="card-expand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></div></div>

        <div class="reader-meta"><span>来源可信度：${esc(item.trust || '未标注')}</span><span>结论置信度：${esc(item.conclusionConfidence || '未标注，不作高置信判断')}</span><span>${esc(item.time)}</span></div>
        ${section('为什么值得读', item.readingValue)}${section('背景与变化', item.background)}${section('发生了什么', item.summary)}${section('对我们工作的借鉴与启发（编辑建议）', item.insight, 'reader-insight')}${section('适用边界', item.boundary)}${section('下一步需要核实', item.verificationQuestion)}
        <div class="reader-tags">${item.tags.map(tag => `<span class="reader-tag" onclick="setTagFilter('${tag}')">#${esc(tag)}</span>`).join('')}</div>
        <div class="reader-actions">${sources || '<span>公开原文待补充</span>'}<button class="btn-close-panel" onclick="toggleCard('${day.date}', '${item.id}')">收起</button></div></div></div>`;
    }

    function renderInfoList() {
      const query = document.getElementById('searchBox').value.toLowerCase().trim();
      const container = document.getElementById('infoContent');
      const statsEl = document.getElementById('stats');
      let filteredDays = allDays.map(day => {
        const filteredItems = day.items.filter(item => {
          if (activeTrustFilter && item.trust !== activeTrustFilter) return false;
          if (activeChannelFilter && classifyChannel(item) !== activeChannelFilter) return false;
          if (activeTopicCategoryFilter && !matchesTopicCategory(item, activeTopicCategoryFilter)) return false;
          if (activeSourceFilter) {
            const p = item.platform || item.source || '';
            if (p !== activeSourceFilter && !p.includes(activeSourceFilter) && !activeSourceFilter.includes(p)) return false;
          }
          if (activeTagFilter && !item.tags.includes(activeTagFilter)) return false;
          if (query) {
            const haystack = [item.title, item.summary, item.source, item.platform, item.insight, item.readingValue, item.background, item.boundary, item.verificationQuestion, ...item.tags].join(' ').toLowerCase();
            return haystack.includes(query);
          }
          return true;
        });
        return { ...day, items: filteredItems };
      });
      const totalItems = filteredDays.reduce((s, d) => s + d.items.length, 0);
      const totalDays = filteredDays.filter(d => d.items.length > 0).length;
      const filters = [];
      if (activeTrustFilter) filters.push(`可信度: ${activeTrustFilter}`);
      if (activeChannelFilter) filters.push(`渠道: ${CHANNEL_FILTERS[activeChannelFilter]?.label || activeChannelFilter}`);
      if (activeTopicCategoryFilter) filters.push(`主题: ${TOPIC_FILTERS[activeTopicCategoryFilter]?.label || activeTopicCategoryFilter}`);
      if (activeSourceFilter) filters.push(`来源: ${activeSourceFilter}`);
      if (activeTagFilter) filters.push(`标签: #${activeTagFilter}`);
      if (query) filters.push(`搜索: "${query}"`);
      statsEl.innerHTML = `共 <strong>${totalDays}</strong> 天 · <strong>${totalItems}</strong> 条信息${filters.length ? ' · ' + esc(filters.join(' · ')) : ''}`;
      if (totalItems === 0) {
        container.innerHTML = `<div class="empty"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg><h3>${allDays.length === 0 ? '暂无沉淀内容' : '未找到匹配结果'}</h3><p>${allDays.length === 0 ? '暂未读取到信息，请稍后重试或查看更新状态。' : '试试调整搜索关键词或筛选条件'}</p></div>`;
        return;
      }
      const observationOpenDates = new Set([...container.querySelectorAll('details[data-reading-date][open]:not([data-auto-open="true"])')].map(section => section.dataset.readingDate));
      let html = '';
      filteredDays.forEach(day => {
        if (day.items.length === 0) return;
        html += `<div class="day-group"><div class="day-header"><h2>📅 ${day.date}</h2><span class="day-count">${day.items.length} 条</span></div>`;
        const descriptions = { '重点读': '与工作直接相关，先看可借鉴的做法', '快速知道': '保留重要变化与背景', '持续观察': '线索、缺口与尚待核实的材料' };
        ['重点读', '快速知道', '持续观察'].forEach(tier => {
          const items = day.items.filter(item => InfoCardSchema.readingTier(item) === tier);
          if (!items.length) return;
          const observing = tier === '持续观察';
          const expanded = filters.length > 0 || observationOpenDates.has(day.date) || items.some(item => openCardId === `${day.date}-${item.id}`);
          const heading = `${tier} · ${items.length} <small>${descriptions[tier]}</small>`;
          html += observing
            ? `<details class="reading-section" data-reading-date="${day.date}" data-auto-open="${filters.length > 0}" ${expanded ? 'open' : ''}><summary>${heading}</summary>`
            : `<section class="reading-section ${tier === '重点读' ? 'reading-featured' : ''}"><h3>${heading}</h3>`;
          html += items.map(item => renderInformationCard(day, item, query)).join('');
          html += observing ? '</details>' : '</section>';
        });
        html += '</div>';
      });
      container.innerHTML = html;
      if (openCardId) {
        const panel = document.getElementById(`panel-${openCardId}`);
        if (panel) setTimeout(() => panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 100);
      }
    }

    function getFilteredKBReports() {

        if (query) {
          const haystack = [r.title, r.description, r.author, r.publisher, ...(r.topics || [])].join(' ').toLowerCase();
          return haystack.includes(query);
        }
        return true;
      });
    }

      // Topics

      topicsEl.innerHTML = (report.topics || []).map(t => `<span class="kb-reader-topic-tag">${KB_TOPIC_TAGS[t] || '📌'} ${esc(t)}</span>`).join('');

      // Content (load summary)
      const contentEl = document.getElementById('kbReaderContent');
      contentEl.innerHTML = '<div class="kb-reader-loading">⏳ 加载摘要内容中...</div>';

      // Load summary markdown if available
      if (report.summaryFile) {
        fetch(report.summaryFile)
          .then(r => r.text())
          .then(md => { contentEl.innerHTML = mdToHtml(md); })
          .catch(() => {
            contentEl.innerHTML = `<p style="color:var(--text2);font-size:13px;">📋 ${esc(report.description || '暂无摘要内容')}</p>`;
          });
      } else {
        contentEl.innerHTML = `<p style="color:var(--text2);font-size:13px;">📋 ${esc(report.description || '暂无摘要内容')}</p>`;
      }

      document.body.style.overflow = 'hidden';
    }

      document.getElementById('kbReaderOverlay').classList.remove('open');

    function mdToHtml(md) {
      if (!md) return '';
      md = md.replace(/(^\|.+\|\n^\|[\s:\-|]+\|\n(?:^\|.+\|\n?)+)/gm, tableBlock => {
        const rows = tableBlock.trim().split('\n').filter(line => !/^\|[\s:\-|]+\|$/.test(line.trim()));
        if (rows.length < 2) return tableBlock;
        const cells = line => line.trim().replace(/^\||\|$/g, '').split('|').map(cell => cell.trim());
        const header = cells(rows[0]);
        const body = rows.slice(1).map(row => cells(row));
        return `<table><thead><tr>${header.map(cell => `<th>${cell}</th>`).join('')}</tr></thead><tbody>${body.map(row => `<tr>${row.map(cell => `<td>${cell}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
      });
      let html = md
        // Remove the title comment block at the top
        .replace(/^> \*\*原标题\*\*.*?\n> \*\*发布日期\*\*.*?\n\n---\n\n/, '')
        // H1
        .replace(/^# (.+)$/gm, '<h1>$1</h1>')
        // H2
        .replace(/^## (.+)$/gm, '<h2>$1</h2>')
        // H3
        .replace(/^### (.+)$/gm, '<h3>$1</h3>')
        // HR
        .replace(/^---$/gm, '<hr>')
        // Blockquote (single line)
        .replace(/^> (.+)$/gm, '<blockquote><p>$1</p></blockquote>')
        // Bold
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        // Italic
        .replace(/\*(.+?)\*/g, '<em>$1</em>')
        // Inline code
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        // Unordered list items
        .replace(/^- (.+)$/gm, '<li>$1</li>')
        // Ordered list items
        .replace(/^\d+\. (.+)$/gm, '<li>$1</li>')
        // Wrap consecutive <li> in <ul>
        .replace(/(<li>.*<\/li>\n?)+/g, match => '<ul>' + match + '</ul>')
        // Paragraphs: wrap non-tag lines
        .split('\n\n')
        .map(block => {
          block = block.trim();
          if (!block) return '';
          if (/^<(h[1-3]|ul|ol|blockquote|hr|div|table)/.test(block)) return block;
          if (block.startsWith('<ul>') || block.startsWith('<ol>')) return block;
          return `<p>${block}</p>`;
        })
        .join('\n');
      return html;
    }

    // ============================================================
    // KB URL Archive
    // ============================================================
    function handleKBArchive(event) {
      event.preventDefault();
      const url = document.getElementById('kbArchiveUrl').value.trim();
      if (!url) return;

      const btn = document.getElementById('kbArchiveBtn');
      const resultEl = document.getElementById('kbArchiveResult');
      btn.disabled = true;
      btn.textContent = '⏳ 处理中...';
      resultEl.innerHTML = '';

      // Since GitHub Pages is static, we show instructions for Javis to process
      setTimeout(() => {
        btn.disabled = false;
        btn.textContent = '📥 存档';
        resultEl.innerHTML = `
          <div class="kb-archive-result success">
            ✅ 链接已记录：<strong>${esc(url)}</strong><br>
            请将此链接发送给 Javis，我将自动抓取内容、解析归档，纳入知识库。
          </div>
        `;
        document.getElementById('kbArchiveUrl').value = '';
      }, 600);
    }
